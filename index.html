<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happy birthday🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Amiri', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffc4d6 0%, #ffb3c6 25%, #ffa3b8 50%, #ff93aa 75%, #ff849c 100%);
            overflow: relative;
            position: relative;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }
        .cake-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 40px;
            height: 200px;
            width: 200px;
        }
        .layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(-400px);
            opacity: 0;
            animation: dropDown 0.6s ease-out forwards;
        }
        @keyframes dropDown {
            0% { opacity: 0; transform: translateX(-50%) translateY(-400px); }
            60% { transform: translateX(-50%) translateY(8px); }
            80% { transform: translateX(-50%) translateY(-3px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .plate { bottom: 0; width: 180px; height: 15px; background: #e0d5c7; border-radius: 50%; animation-delay: 0.2s; }
        .layer-1 { bottom: 15px; width: 150px; height: 35px; background: #d7ccc8; animation-delay: 0.5s; }
        .layer-2 { bottom: 50px; width: 150px; height: 20px; background: #ffffff; animation-delay: 0.8s; }
        .layer-3 { bottom: 70px; width: 150px; height: 35px; background: #ffcdd2; animation-delay: 1.1s; }
        .layer-4 { bottom: 105px; width: 150px; height: 20px; background: #ffffff; animation-delay: 1.4s; }
        .layer-5 { bottom: 125px; width: 150px; height: 35px; background: #efebe9; animation-delay: 1.7s; border-radius: 5px 5px 0 0; }
        .candle-container {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            animation: candleAppear 0.6s ease-out 2s forwards;
        }
        @keyframes candleAppear {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .candle {
            width: 12px;
            height: 40px;
            background: linear-gradient(to bottom, #e3f2fd, #bbdefb);
            border-radius: 2px;
        }
        .flame {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 18px;
            background: #ffd700;
            border-radius: 50% 50% 20% 20%;
            animation: flicker 1s infinite;
            box-shadow: 0 0 10px #ffa500;
        }
        @keyframes flicker {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }
        .birthday-text {
            font-family: 'Pacifico', cursive;
            font-size: 2.5em;
            color: #c2185b;
            opacity: 0;
            animation: fadeIn 1s ease-out 2.5s forwards;
            margin-bottom: 30px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* نموذج كلمة السر */
        .password-section {
            opacity: 0;
            animation: fadeIn 1s ease-out 3.5s forwards;
        }
        
        .password-label {
            font-family: 'Pacifico', cursive;
            font-size: 1.3em;
            color: #c2185b;
            margin-bottom: 15px;
            display: block;
        }
        
        .password-input {
            width: 100%;
            max-width: 300px;
            padding: 15px 20px;
            font-size: 1.2em;
            border: 2px solid rgba(194, 24, 91, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.9);
            color: #c2185b;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Amiri', serif;
            margin-bottom: 20px;
        }
        
        .password-input:focus {
            border-color: #c2185b;
            box-shadow: 0 0 15px rgba(194, 24, 91, 0.3);
            background: #fff;
        }
        
        .password-input::placeholder {
            color: rgba(194, 24, 91, 0.5);
        }
        
        .unlock-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
            transition: all 0.3s ease;
            font-family: 'Pacifico', cursive;
        }
        
        .unlock-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.6);
        }
        
        .unlock-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #ff1493;
            font-size: 1.1em;
            margin-top: 15px;
            font-family: 'Amiri', serif;
            display: none;
        }
        
        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        @media (max-width: 768px) {
            .birthday-text {
                font-size: 2em;
            }
            .password-label {
                font-size: 1.1em;
            }
            .password-input {
                font-size: 1em;
            }
            .unlock-btn {
                font-size: 1.1em;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="cake-wrapper">
            <div class="layer plate"></div>
            <div class="layer layer-1"></div>
            <div class="layer layer-2"></div>
            <div class="layer layer-3"></div>
            <div class="layer layer-4"></div>
            <div class="layer layer-5"></div>
            <div class="candle-container">
                <div class="flame"></div>
                <div class="candle"></div>
            </div>
        </div>
        <div class="birthday-text">Happy Birthday </div>
        <div class="password-section">
            <label class="password-label">password</label>
        
            <input 
                type="password" 
                id="passwordInput" 
                class="password-input" 
                placeholder="اكتبي الباسورد يهجورتي"
                required
            />
        
            <br>
            <button type="button" class="unlock-btn" onclick="checkPassword()">🔓</button>
        
            <p class="error-message" id="errorMsg">❌ حاولي تاني يهجورتي</p>
        </div>
    </div>

<script>
function checkPassword() {
    const input = document.getElementById("passwordInput").value;
    const errorMsg = document.getElementById("errorMsg");

    // الباسورد الصح
    const correctPassword = "21"; // غيره زي ما تحب

    if (input === correctPassword) {
        // احتفال 🎉
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 }
        });

        // تحويل بعد ثانية
        setTimeout(() => {
            window.location.href = "main.html"; // الصفحة اللي بعدها
        }, 1200);

    } else {
        errorMsg.classList.add("show");
        setTimeout(() => {
            errorMsg.classList.remove("show");
        }, 1500);
    }
}
</script>

<style>
body,input,* {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
}
input {
    -webkit-user-select: text !important;
    user-select: text !important;
}
</style>

</body>
